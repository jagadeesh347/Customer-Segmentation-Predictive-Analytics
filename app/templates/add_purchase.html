
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Purchase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        h2 {
            color: #243b53;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button, .back {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .back {
            background: #64748b;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add Customer Purchase</h2>

        {% if message %}
            <p class="success">{{ message }}</p>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('add_purchase') }}">
            <label for="customer_id">Select Customer</label>
            <select id="customer_id" name="customer_id" required>
                <option value="">Choose a customer</option>
                {% for customer in customers %}
                    <option value="{{ customer.customer_id }}">
                        {{ customer.customer_code }}
                    </option>
                {% endfor %}
            </select>

            <label for="order_date">Purchase Date</label>
            <input
                type="date"
                id="order_date"
                name="order_date"
                value="{{ today }}"
                required
            >

            <label for="quantity">Quantity</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                value="1"
                required
            >

            <label for="unit_price">Price per item (₹)</label>
            <input
                type="number"
                id="unit_price"
                name="unit_price"
                min="0"
                step="0.01"
                value="500"
                required
            >

            <button type="submit">Save Purchase</button>
        </form>

        <a class="back" href="{{ url_for('home') }}">
            Back to Dashboard
        </a>
    </div>
</body>
</html>
